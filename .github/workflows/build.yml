name: Build SHAULA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install pyttsx3 SpeechRecognition pyaudio google-generativeai psutil Pillow keyboard duckduckgo-search pycaw comtypes requests playwright chess pyinstaller
          python -m playwright install chromium

      - name: Compila exe
        run: |
          pyinstaller --onefile --windowed --name SHAULA --add-data "config.json;." --hidden-import=pyaudio --hidden-import=speech_recognition --hidden-import=pycaw --hidden-import=comtypes --hidden-import=keyboard --hidden-import=chess --collect-all=google.generativeai --collect-all=duckduckgo_search --collect-all=playwright shaula.py

      - uses: actions/upload-artifact@v4
        with:
          name: SHAULA-Windows
          path: |
            dist/SHAULA.exe
            config.json
